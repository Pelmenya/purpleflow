name: Release

# Тег X.Y.Z (npm run release -- X.Y.Z) → сборки всех ОС в черновике релиза. Обновление дойдёт до пользователей,
# когда черновик опубликован вручную: electron-updater черновики не видит.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  # Только установщик — в уже существующий релиз (например, выпустить его без новой версии PurpleFlow).
  # Сборка — из текущего main; версия installer/package.json должна совпадать с тегом релиза.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Релиз, в который положить установщик, например 0.7.0'
        required: true

permissions:
  contents: write

jobs:
  # Черновик создаётся заранее и один: иначе задачи матрицы стартуют одновременно, не находят его
  # и каждая заводит свой — файлы ОС расходятся по разным черновикам.
  draft:
    name: Черновик релиза
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Создать черновик, если его ещё нет
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          found=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          if [ "$found" = 0 ]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          else
            echo "Релиз $TAG уже есть — файлы лягут в него."
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS собирается локально и загружается в тот же черновик.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Тег совпадает с версией приложения
        shell: bash
        run: test "$(node -p "require('./app/package.json').version")" = "$GITHUB_REF_NAME"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Сборка и загрузка в черновик
        shell: bash
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          # Без подписи macOS сборка соберётся, но обновляться сама не сможет: Squirrel отвергает неподписанное.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Диктовка: whisper-cli из исходников whisper.cpp (cmake и компилятор есть на раннерах GitHub).
          node ../scripts/build-whisper.mjs
          npx electron-vite build
          args=()
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then
            echo "::warning::Нет MAC_CSC_LINK: сборка macOS без подписи и автообновления"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            args+=(-c.mac.notarize=false)
          fi
          # На Windows и Linux секреты Apple не нужны, а пустой CSC_LINK electron-builder принял бы за путь.
          if [ "$RUNNER_OS" != macOS ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          npx electron-builder --publish always "${args[@]}"
      # Установщик (installer/) — в тот же черновик. Имена файлов без версии, поэтому ссылки вида
      # releases/latest/download/PurpleFlow-Installer-x64.exe всегда ведут на последний опубликованный выпуск.
      # Сам он не обновляется и latest*.yml не публикует — файлы автообновления PurpleFlow не задеты.
      - name: Установщик — сборка и загрузка в черновик
        shell: bash
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$TAG"
          npx electron-vite build
          node scripts/dist.mjs --publish never
          shopt -s nullglob
          # Отдельные файлы под архитектуру; общий PurpleFlow-Installer.exe на обе — вдвое тяжелее, его не выкладываем.
          files=(release/PurpleFlow-Installer-*.exe release/PurpleFlow-Installer-*.AppImage release/PurpleFlow-Installer-*.deb release/PurpleFlow-Installer-*.rpm)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::Установщик не собрался: нет файлов в installer/release"; exit 1; fi
          gh release upload "$TAG" "${files[@]}" --clobber

  installer:
    name: Только установщик (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # rpm-пакет собирается утилитой rpmbuild — на раннере Ubuntu её нет.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Сборка и загрузка в релиз
        shell: bash
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --json tagName > /dev/null
          test "$(node -p "require('./package.json').version")" = "$TAG"
          npx electron-vite build
          node scripts/dist.mjs --publish never
          shopt -s nullglob
          files=(release/PurpleFlow-Installer-*.exe release/PurpleFlow-Installer-*.AppImage release/PurpleFlow-Installer-*.deb release/PurpleFlow-Installer-*.rpm)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::Установщик не собрался: нет файлов в installer/release"; exit 1; fi
          gh release upload "$TAG" "${files[@]}" --clobber
