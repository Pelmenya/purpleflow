appId: ru.purpleschool.purpleflow
electronVersion: 44.5.1
productName: PurpleFlow
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../core/prompts
    to: prompts
  # Диктовка: whisper-cli из scripts/build-whisper.mjs (macOS — универсальный, Windows и Linux — x64).
  - from: whisper-bin/${os}
    to: whisper
asarUnpack: []
npmRebuild: false
# Канал обновлений: окно читает latest*.yml из опубликованного релиза. Черновики electron-updater не видит.
publish:
  provider: github
  owner: PurpleSchool
  repo: purpleflow
  # Теги версий без префикса: 0.1.1, а не v0.1.1.
  vPrefixedTagName: false
mac:
  category: public.app-category.developer-tools
  # Фон во всё поле: так macOS 26+ не сажает значок в светлую подложку.
  icon: build/icon-mac.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Подпись: сертификат «Developer ID Application» из связки ключей (или CSC_LINK/CSC_KEY_PASSWORD).
  # Нотаризация: APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER или APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID.
  notarize: true
  # Диктовка: без описания macOS не покажет запрос доступа к микрофону.
  extendInfo:
    NSMicrophoneUsageDescription: PurpleFlow записывает голос только для диктовки — речь распознаётся на этом компьютере.
dmg:
  artifactName: PurpleFlow-${version}-${arch}.dmg
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: PurpleFlow-Setup-${version}-${arch}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: purpleflow
  syncDesktopName: true
  target: [AppImage, deb, rpm]
  category: Development
  maintainer: PurpleSchool
  artifactName: PurpleFlow-${version}-${arch}.${ext}
